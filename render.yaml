services:
  - type: web
    name: gym-coach-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /opt/render/project/src/server/data/database.sqlite
